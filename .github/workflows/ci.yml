name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node <<'NODE'
            const fs = require("node:fs");
            const summary = JSON.parse(
              fs.readFileSync("coverage/coverage-summary.json", "utf8"),
            );
            const t = summary.total;
            const line = (label, m) =>
              `| ${label} | ${m.pct}% | ${m.covered}/${m.total} |`;
            const md = [
              "## Coverage",
              "",
              "| Type | % | Covered/Total |",
              "| --- | --- | --- |",
              line("Statements", t.statements),
              line("Branches", t.branches),
              line("Functions", t.functions),
              line("Lines", t.lines),
              "",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);
            NODE
          else
            echo "No coverage-summary.json found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            .github/badges/coverage.svg
          if-no-files-found: warn

      - name: Build
        run: npm run build
        env:
          # Build should not require live secrets; stub minimum for Next collect.
          WEB_PANEL_SESSION_KEY: ci-build-session-key-at-least-32-chars!!
